<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550" role="img" aria-label="Huevang XIONGPOR Developer Profile and Ecosystem">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&amp;family=Fira+Code:wght@500;600;700&amp;display=swap');
      .code { font-family: 'Fira Code', 'Courier New', Menlo, Consolas, monospace; font-size: 12px; }
      .head { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif; }
    </style>

    <linearGradient id="cardBgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04080d"/>
      <stop offset="45%" stop-color="#08141d"/>
      <stop offset="100%" stop-color="#03060a"/>
    </linearGradient>

    <linearGradient id="cardBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>

    <radialGradient id="haloTeal">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#ffd700" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>

    <pattern id="cardGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2dd4bf" stroke-width="0.8" stroke-opacity="0.06"/>
      <circle cx="0" cy="0" r="1.2" fill="#ffd700" fill-opacity="0.12"/>
    </pattern>

    <clipPath id="mainClip">
      <rect width="1000" height="550"/>
    </clipPath>
  </defs>

  <g clip-path="url(#mainClip)">
    <!-- Base Card Canvas -->
    <rect width="1000" height="550" fill="url(#cardBgGrad)"/>
    <rect width="1000" height="550" fill="url(#cardGrid)"/>

    <!-- Subtle Ambient Glows -->
    <circle cx="235" cy="270" r="230" fill="url(#haloTeal)"/>
    <circle cx="740" cy="270" r="240" fill="url(#haloTeal)" opacity="0.6"/>

    <!-- ════════════════════ LEFT SIDE: INTERACTIVE ORBIT (X: 0 to 475) ════════════════════ -->
    <g transform="translate(235, 260)">
      <!-- Concentric Orbit Rings -->
      <circle r="85" fill="none" stroke="#2dd4bf" stroke-opacity="0.35" stroke-dasharray="3 6">
        <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="20s" repeatCount="indefinite"/>
      </circle>
      <circle r="145" fill="none" stroke="#ffd700" stroke-opacity="0.35" stroke-dasharray="4 7">
        <animate attributeName="stroke-dashoffset" from="0" to="100" dur="28s" repeatCount="indefinite"/>
      </circle>
      <circle r="202" fill="none" stroke="#2dd4bf" stroke-opacity="0.32" stroke-dasharray="3 6">
        <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="38s" repeatCount="indefinite"/>
      </circle>

      <!-- Center Developer Node -->
      <circle r="44" fill="#060c12" stroke="url(#cardBorder)" stroke-width="2.5"/>
      <text x="0" y="-6" text-anchor="middle" fill="#2dd4bf" class="head" font-size="13" font-weight="900" letter-spacing="1">HUEVANG</text>
      <text x="0" y="14" text-anchor="middle" fill="#2dd4bf" class="head" font-size="11.5" font-weight="800">26 y/o</text>

      <!-- Orbit Ring 1 (Speed: 20s) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
        <!-- Python -->
        <g transform="translate(85, 0)">
          <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="20s" repeatCount="indefinite"/>
            <rect x="-38" y="-12" width="76" height="24" fill="#081018" stroke="#ffd700" stroke-width="1.2"/>
            <circle cx="-25" cy="0" r="3.5" fill="#ffd700"/>
            <text x="7" y="4" text-anchor="middle" fill="#ffffff" class="head" font-size="11.5" font-weight="700">Python</text>
          </g>
        </g>
        <!-- Node.js -->
        <g transform="translate(-42.5, 73.6)">
          <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="20s" repeatCount="indefinite"/>
            <rect x="-40" y="-12" width="80" height="24" fill="#081018" stroke="#2dd4bf" stroke-width="1.2"/>
            <circle cx="-27" cy="0" r="3.5" fill="#0d9488"/>
            <text x="7" y="4" text-anchor="middle" fill="#ffffff" class="head" font-size="11.5" font-weight="700">Node.js</text>
          </g>
        </g>
        <!-- Vue 3 -->
        <g transform="translate(-42.5, -73.6)">
          <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="20s" repeatCount="indefinite"/>
            <rect x="-35" y="-12" width="70" height="24" fill="#081018" stroke="#2dd4bf" stroke-width="1.2"/>
            <circle cx="-22" cy="0" r="3.5" fill="#0d9488"/>
            <text x="7" y="4" text-anchor="middle" fill="#ffffff" class="head" font-size="11.5" font-weight="700">Vue 3</text>
          </g>
        </g>
      </g>

      <!-- Orbit Ring 2 (Speed: 28s counter-clockwise) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="28s" repeatCount="indefinite"/>
        <!-- React -->
        <g transform="translate(145, 0)">
          <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
            <rect x="-34" y="-12" width="68" height="24" fill="#081018" stroke="#2dd4bf" stroke-width="1.2"/>
            <circle cx="-21" cy="0" r="3.5" fill="#0d9488"/>
            <text x="7" y="4" text-anchor="middle" fill="#ffffff" class="head" font-size="11.5" font-weight="700">React</text>
          </g>
        </g>
        <!-- Nest.js -->
        <g transform="translate(0, 145)">
          <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
            <rect x="-38" y="-12" width="76" height="24" fill="#081018" stroke="#ffd700" stroke-width="1.2"/>
            <circle cx="-25" cy="0" r="3.5" fill="#ffd700"/>
            <text x="7" y="4" text-anchor="middle" fill="#ffffff" class="head" font-size="11.5" font-weight="700">Nest.js</text>
          </g>
        </g>
        <!-- Flutter -->
        <g transform="translate(-145, 0)">
          <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
            <rect x="-36" y="-12" width="72" height="24" fill="#081018" stroke="#2dd4bf" stroke-width="1.2"/>
            <circle cx="-23" cy="0" r="3.5" fill="#0d9488"/>
            <text x="7" y="4" text-anchor="middle" fill="#ffffff" class="head" font-size="11.5" font-weight="700">Flutter</text>
          </g>
        </g>
        <!-- Nuxt 3 -->
        <g transform="translate(0, -145)">
          <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
            <rect x="-36" y="-12" width="72" height="24" fill="#081018" stroke="#ffd700" stroke-width="1.2"/>
            <circle cx="-23" cy="0" r="3.5" fill="#ffd700"/>
            <text x="7" y="4" text-anchor="middle" fill="#ffffff" class="head" font-size="11.5" font-weight="700">Nuxt 3</text>
          </g>
        </g>
      </g>

      <!-- Orbit Ring 3 (Speed: 38s clockwise) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite"/>
        <!-- PostgreSQL -->
        <g transform="translate(202, 0)">
          <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="38s" repeatCount="indefinite"/>
            <rect x="-50" y="-12" width="100" height="24" fill="#081018" stroke="#2dd4bf" stroke-width="1.2"/>
            <circle cx="-35" cy="0" r="3.5" fill="#0d9488"/>
            <text x="8" y="4" text-anchor="middle" fill="#ffffff" class="head" font-size="11.5" font-weight="700">PostgreSQL</text>
          </g>
        </g>
        <!-- Banking APIs -->
        <g transform="translate(-101, 175)">
          <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="38s" repeatCount="indefinite"/>
            <rect x="-55" y="-12" width="110" height="24" fill="#081018" stroke="#ffd700" stroke-width="1.2"/>
            <circle cx="-40" cy="0" r="3.5" fill="#ffd700"/>
            <text x="8" y="4" text-anchor="middle" fill="#ffffff" class="head" font-size="11.5" font-weight="700">Banking APIs</text>
          </g>
        </g>
        <!-- Docker -->
        <g transform="translate(-101, -175)">
          <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="38s" repeatCount="indefinite"/>
            <rect x="-38" y="-12" width="76" height="24" fill="#081018" stroke="#2dd4bf" stroke-width="1.2"/>
            <circle cx="-25" cy="0" r="3.5" fill="#0d9488"/>
            <text x="7" y="4" text-anchor="middle" fill="#ffffff" class="head" font-size="11.5" font-weight="700">Docker</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Bottom Orbit Caption -->
    <text x="235" y="512" text-anchor="middle" fill="#2dd4bf" class="head" font-size="12" font-weight="700" letter-spacing="2">
      ⚡ FULL-STACK ECOSYSTEM • CORE ARCHITECTURE
    </text>

    <!-- Center Vertical Divider -->
    <line x1="472" y1="20" x2="472" y2="530" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4"/>

    <!-- ════════════════════ RIGHT SIDE: CODE & PROFILE CARD (X: 485 to 985) ════════════════════ -->
    <g transform="translate(485, 20)">
      <!-- macOS Glass Window (Sharp 90-degree corners) -->
      <rect width="495" height="505" fill="#060c13" stroke="#2dd4bf" stroke-width="1.2" stroke-opacity="0.45"/>
      <!-- Window Title Bar -->
      <rect width="495" height="38" fill="#0b1620"/>
      <line x1="0" y1="38" x2="495" y2="38" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.25"/>

            <!-- Animated Cyber Scanner Line in Code Editor -->
      <line x1="0" y1="36" x2="495" y2="36" stroke="#2dd4bf" stroke-width="1.2" stroke-opacity="0.3">
        <animate attributeName="y1" values="36;485;36" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="36;485;36" dur="6s" repeatCount="indefinite"/>
      </line>

      <!-- Window Control Dots -->
      <circle cx="20" cy="19" r="5.5" fill="#ff5f56"/>
      <circle cx="38" cy="19" r="5.5" fill="#ffbd2e"/>
      <circle cx="56" cy="19" r="5.5" fill="#27c93f"/>

      <!-- Window Title -->
      <text x="248" y="24" text-anchor="middle" fill="#2dd4bf" class="code" font-size="12" font-weight="700">
        huevang_profile.js
      </text>

      <!-- Profile Header Inside Window -->
      <g transform="translate(20, 60)">
        <text x="0" y="0" fill="#2dd4bf" class="head" font-size="18" font-weight="900" letter-spacing="1">
          <tspan fill="#ffffff">HUEVANG</tspan> <tspan fill="#2dd4bf">XIONGPOR</tspan>
        </text>
        <rect x="236" y="-14" width="82" height="20" fill="#0f2420" stroke="#22c55e" stroke-width="1"/>
        <text x="277" y="0" text-anchor="middle" fill="#2dd4bf" class="head" font-size="11" font-weight="800">
          AGE: 26 YO
        </text>

        <!-- Quick Contacts Bar Inside Window -->
        <text x="0" y="22" fill="#2dd4bf" class="code" font-size="12" font-weight="600">
          📞 020 78849378  •  ✉️ huevang933@gmail.com
        </text>
        <text x="0" y="42" fill="#ffffff" class="head" font-size="12">
          📍 Vientiane Capital, Laos 🇱🇦 • NUOL Graduate
        </text>
      </g>

      <!-- English Quote Banner (Sharp corners, 100% English) -->
      <g transform="translate(20, 126)">
        <rect x="0" y="0" width="455" height="36" fill="#08141d" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.3"/>
        <text x="14" y="22" fill="#ffffff" class="head" font-size="12" font-weight="700">
          ⚡ Full-Stack Developer &amp; Banking Systems Architect
        </text>
      </g>

      <!-- Syntax-Highlighted Code Block with explicit Y line positions (Solid colors) -->
      <g transform="translate(20, 188)" class="code">
        <!-- Line 1 -->
        <text x="0" y="0"><tspan fill="#2dd4bf" font-weight="700">const</tspan> <tspan fill="#2dd4bf">huevang</tspan> = {</text>

        <!-- Line 2 -->
        <text x="14" y="20"><tspan fill="#2dd4bf">name</tspan>: <tspan fill="#2dd4bf">"Huevang XIONGPOR"</tspan>,</text>

        <!-- Line 3 -->
        <text x="14" y="40"><tspan fill="#2dd4bf">age</tspan>: <tspan fill="#2dd4bf">26</tspan>,</text>

        <!-- Line 4 -->
        <text x="14" y="60"><tspan fill="#2dd4bf">phone</tspan>: <tspan fill="#2dd4bf">"020 78849378"</tspan>,</text>

        <!-- Line 5 -->
        <text x="14" y="80"><tspan fill="#2dd4bf">email</tspan>: <tspan fill="#2dd4bf">"huevang933@gmail.com"</tspan>,</text>

        <!-- Line 6 -->
        <text x="14" y="100"><tspan fill="#2dd4bf">location</tspan>: <tspan fill="#2dd4bf">"Vientiane, Laos 🇱🇦"</tspan>,</text>

        <!-- Line 7 -->
        <text x="14" y="120"><tspan fill="#2dd4bf">roles</tspan>: [<tspan fill="#2dd4bf">"Full-Stack Dev"</tspan>, <tspan fill="#2dd4bf">"Banking Specialist"</tspan>],</text>

        <!-- Line 8 -->
        <text x="14" y="140"><tspan fill="#2dd4bf">stack</tspan>: {</text>

        <!-- Line 9 -->
        <text x="28" y="160"><tspan fill="#2dd4bf">front</tspan>: [<tspan fill="#2dd4bf">"Vue 3"</tspan>, <tspan fill="#2dd4bf">"Nuxt"</tspan>, <tspan fill="#2dd4bf">"React"</tspan>, <tspan fill="#2dd4bf">"Tailwind"</tspan>],</text>

        <!-- Line 10 -->
        <text x="28" y="180"><tspan fill="#2dd4bf">back</tspan>: [<tspan fill="#2dd4bf">"Node.js"</tspan>, <tspan fill="#2dd4bf">"Nest.js"</tspan>, <tspan fill="#2dd4bf">"Python"</tspan>, <tspan fill="#2dd4bf">"Laravel"</tspan>],</text>

        <!-- Line 11 -->
        <text x="28" y="200"><tspan fill="#2dd4bf">mobile</tspan>: [<tspan fill="#2dd4bf">"Flutter"</tspan>, <tspan fill="#2dd4bf">"Dart"</tspan>],</text>

        <!-- Line 12 -->
        <text x="28" y="220"><tspan fill="#2dd4bf">database</tspan>: [<tspan fill="#2dd4bf">"PostgreSQL"</tspan>, <tspan fill="#2dd4bf">"MySQL"</tspan>, <tspan fill="#2dd4bf">"MongoDB"</tspan>]</text>

        <!-- Line 13 -->
        <text x="14" y="240">},</text>

        <!-- Line 14 -->
        <text x="14" y="260"><tspan fill="#2dd4bf">motto</tspan>: <tspan fill="#2dd4bf">"Clean architecture &amp; continuous precision."</tspan></text>

        <!-- Line 15 -->
        <text x="0" y="280">};</text>
      </g>
    </g>

    <!-- Outer Luxury Teal-Gold Border (Sharp 90-degree corners) -->
    <rect x="1" y="1" width="998" height="548" fill="none" stroke="url(#cardBorder)" stroke-width="1.8" stroke-opacity="0.55"/>
  </g>
</svg>