<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 44" width="1000" height="44" role="img" aria-label="Huevang Status Badges">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&amp;display=swap');
      .b-mono { font-family: 'Fira Code', Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 700; letter-spacing: 0.5px; }
      @keyframes pulseNeon { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    </style>
  </defs>

  <g transform="translate(0, 5)">
    <!-- 1. Location Badge -->
    <g transform="translate(0, 0)">
      <rect width="160" height="34" fill="#040a10" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="18" cy="17" r="4" fill="#00f0ff"/>
      <text x="32" y="21.5" fill="#ffffff" class="b-mono">Vientiane, LA 🇱🇦</text>
    </g>

    <!-- 2. Age Badge -->
    <g transform="translate(172, 0)">
      <rect width="130" height="34" fill="#040a10" stroke="#ffd700" stroke-width="1.2" stroke-opacity="0.7"/>
      <text x="65" y="21.5" text-anchor="middle" fill="#00ff66" class="b-mono">🎂 Age: 26 Yrs</text>
    </g>

    <!-- 3. Phone Badge -->
    <g transform="translate(314, 0)">
      <rect width="160" height="34" fill="#040a10" stroke="#00ff66" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="80" y="21" text-anchor="middle" fill="#00ff66" class="b-mono">📞 020 78849378</text>
    </g>

    <!-- 4. Email Badge -->
    <g transform="translate(486, 0)">
      <rect width="220" height="34" fill="#040a10" stroke="#ffd700" stroke-width="1.2" stroke-opacity="0.7"/>
      <text x="110" y="21" text-anchor="middle" fill="#00ff66" class="b-mono">✉️ huevang933@gmail</text>
    </g>

    <!-- 5. Banking & Enterprise -->
    <g transform="translate(718, 0)">
      <rect width="150" height="34" fill="#040a10" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="75" y="21.5" text-anchor="middle" fill="#ffffff" class="b-mono">🏦 Core Banking</text>
    </g>

    <!-- 6. Open to Hire -->
    <g transform="translate(880, 0)">
      <rect width="120" height="34" fill="#040a10" stroke="#00ff66" stroke-width="1.4"/>
      <circle cx="16" cy="17" r="4" fill="#00ff66" style="animation: pulseNeon 1.8s infinite;"/>
      <text x="28" y="21.5" fill="#00ff66" class="b-mono">AVAILABLE</text>
    </g>
  </g>
</svg>