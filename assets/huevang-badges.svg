<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 44" width="980" height="44" role="img" aria-label="Huevang Status Badges">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@500;700&amp;family=Outfit:wght@600;700&amp;family=Fira+Code:wght@600&amp;display=swap');
      .b-text { font-family: 'Outfit', 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; }
      .b-lao { font-family: 'Noto Sans Lao', 'Segoe UI Lao', 'Leelawadee UI', sans-serif; font-size: 12px; font-weight: 700; }
      .b-mono { font-family: 'Fira Code', Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 600; }
      @keyframes pulseG { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
    </style>
  </defs>

  <g transform="translate(0, 4)">
    <!-- 1. Location Badge -->
    <g transform="translate(0, 0)">
      <rect width="154" height="34" fill="#060c12" stroke="#2dd4bf" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="20" cy="17" r="4" fill="#2dd4bf"/>
      <text x="32" y="21.5" fill="#ffffff" class="b-text">Vientiane, Laos 🇱🇦</text>
    </g>

    <!-- 2. Age Badge -->
    <g transform="translate(164, 0)">
      <rect width="118" height="34" fill="#060c12" stroke="#ffd700" stroke-width="1.2" stroke-opacity="0.7"/>
      <text x="59" y="21.5" text-anchor="middle" fill="#ffd700" class="b-text">🎂 Age: 26 Years</text>
    </g>

    <!-- 3. Phone Badge -->
    <g transform="translate(292, 0)">
      <rect width="144" height="34" fill="#060c12" stroke="#2dd4bf" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="72" y="21" text-anchor="middle" fill="#ffffff" class="b-mono">📞 020 78849378</text>
    </g>

    <!-- 4. Email Badge -->
    <g transform="translate(446, 0)">
      <rect width="210" height="34" fill="#060c12" stroke="#ffd700" stroke-width="1.2" stroke-opacity="0.7"/>
      <text x="105" y="21" text-anchor="middle" fill="#ffd700" class="b-mono">✉️ huevang933@gmail.com</text>
    </g>

    <!-- 5. Banking & Enterprise -->
    <g transform="translate(666, 0)">
      <rect width="150" height="34" fill="#060c12" stroke="#2dd4bf" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="75" y="21.5" text-anchor="middle" fill="#ffffff" class="b-text">🏦 Core Banking</text>
    </g>

    <!-- 6. Open to Collaboration -->
    <g transform="translate(826, 0)">
      <rect width="154" height="34" fill="#060c12" stroke="#22c55e" stroke-width="1.4"/>
      <circle cx="20" cy="17" r="4.5" fill="#22c55e" style="animation: pulseG 2s infinite;"/>
      <text x="32" y="21.5" fill="#22c55e" class="b-text">Available to Hire</text>
    </g>
  </g>
</svg>