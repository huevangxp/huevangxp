<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 44" width="1000" height="44" role="img" aria-label="Huevang Status Badges">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&amp;family=Fira+Code:wght@600&amp;display=swap');
      .b-text { font-family: 'Outfit', 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; }
      .b-mono { font-family: 'Fira Code', Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 600; }
      @keyframes pulseG { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
    </style>
  </defs>

  <g transform="translate(0, 5)">
    <!-- 1. Location Badge -->
    <g transform="translate(0, 0)">
      <rect width="160" height="34" fill="#060c12" stroke="#2dd4bf" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="18" cy="17" r="4" fill="#2dd4bf"/>
      <text x="30" y="21.5" fill="#ffffff" class="b-text">Vientiane, Laos 🇱🇦</text>
    </g>

    <!-- 2. Age Badge -->
    <g transform="translate(172, 0)">
      <rect width="130" height="34" fill="#060c12" stroke="#ffd700" stroke-width="1.2" stroke-opacity="0.7"/>
      <text x="65" y="21.5" text-anchor="middle" fill="#ffd700" class="b-text">🎂 Age: 26 Years</text>
    </g>

    <!-- 3. Phone Badge -->
    <g transform="translate(314, 0)">
      <rect width="160" height="34" fill="#060c12" stroke="#2dd4bf" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="80" y="21" text-anchor="middle" fill="#ffffff" class="b-mono">📞 020 78849378</text>
    </g>

    <!-- 4. Email Badge -->
    <g transform="translate(486, 0)">
      <rect width="220" height="34" fill="#060c12" stroke="#ffd700" stroke-width="1.2" stroke-opacity="0.7"/>
      <text x="110" y="21" text-anchor="middle" fill="#ffd700" class="b-mono">✉️ huevang933@gmail.com</text>
    </g>

    <!-- 5. Banking & Enterprise -->
    <g transform="translate(718, 0)">
      <rect width="150" height="34" fill="#060c12" stroke="#2dd4bf" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="75" y="21.5" text-anchor="middle" fill="#ffffff" class="b-text">🏦 Core Banking</text>
    </g>

    <!-- 6. Open to Hire -->
    <g transform="translate(880, 0)">
      <rect width="120" height="34" fill="#060c12" stroke="#22c55e" stroke-width="1.4"/>
      <circle cx="16" cy="17" r="4" fill="#22c55e" style="animation: pulseG 2s infinite;"/>
      <text x="28" y="21.5" fill="#22c55e" class="b-text">Available</text>
    </g>
  </g>
</svg>