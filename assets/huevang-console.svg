<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="Interactive Developer Terminal Console">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600;700&amp;family=Share+Tech+Mono&amp;display=swap');
      .m { font-family: 'Fira Code', 'Share Tech Mono', Menlo, Consolas, monospace; font-size: 13px; }
      .header-mono { font-family: 'Share Tech Mono', 'Fira Code', monospace; }
      @keyframes g0 { 0%, 4.5% { opacity: 1; } 5.0%, 100% { opacity: 1; } }
      @keyframes c0 { 0%, 4.5% { transform: scaleX(1); animation-timing-function: steps(9, end); } 8.0%, 100% { transform: scaleX(0); } }
      @keyframes g1 { 0%, 9.5% { opacity: 0; } 9.6%, 97% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes g2 { 0%, 13.5% { opacity: 0; } 13.6%, 97% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes c2 { 0%, 13.6% { transform: scaleX(1); animation-timing-function: steps(18, end); } 18.0%, 100% { transform: scaleX(0); } }
      @keyframes g3 { 0%, 19.5% { opacity: 0; } 19.6%, 97% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes g4 { 0%, 25.5% { opacity: 0; } 25.6%, 97% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes c4 { 0%, 25.6% { transform: scaleX(1); animation-timing-function: steps(19, end); } 30.5%, 100% { transform: scaleX(0); } }
      @keyframes g5 { 0%, 32.5% { opacity: 0; } 32.6%, 97% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes g6 { 0%, 37.5% { opacity: 0; } 37.6%, 97% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes c6 { 0%, 37.6% { transform: scaleX(1); animation-timing-function: steps(13, end); } 42.0%, 100% { transform: scaleX(0); } }
      @keyframes g7 { 0%, 44.0% { opacity: 0; } 44.1%, 97% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes g8 { 0%, 49.0% { opacity: 0; } 49.1%, 97% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes c8 { 0%, 49.1% { transform: scaleX(1); animation-timing-function: steps(12, end); } 53.5%, 100% { transform: scaleX(0); } }
      @keyframes g9 { 0%, 55.5% { opacity: 0; } 55.6%, 97% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes g10 { 0%, 60.5% { opacity: 0; } 60.6%, 97% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes c10 { 0%, 60.6% { transform: scaleX(1); animation-timing-function: steps(13, end); } 65.0%, 100% { transform: scaleX(0); } }
      @keyframes g11 { 0%, 67.0% { opacity: 0; } 67.1%, 97% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes scanmove {
        0% { transform: translateY(0); opacity: 0; }
        15% { opacity: 0.8; }
        85% { opacity: 0.8; }
        100% { transform: translateY(420px); opacity: 0; }
      }
      .laser-scan {
        animation: scanmove 6s linear infinite;
      }
    </style>
    <clipPath id="winClip">
      <rect width="1000" height="420"/>
    </clipPath>
    <linearGradient id="headerGradHacker" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="scannerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00ff66" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="80%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00ff66" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="depthFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#winClip)">
    <!-- Base Deep Obsidian Console Canvas -->
    <rect width="1000" height="420" fill="#020408"/>

    <!-- 3D Cyberspace Perspective Depth Grid in Background -->
    <g opacity="0.16">
      <line x1="500" y1="40" x2="0" y2="420" stroke="#00f0ff" stroke-width="1"/>
      <line x1="500" y1="40" x2="150" y2="420" stroke="#00f0ff" stroke-width="1"/>
      <line x1="500" y1="40" x2="320" y2="420" stroke="#00f0ff" stroke-width="1"/>
      <line x1="500" y1="40" x2="500" y2="420" stroke="#00ff66" stroke-width="1" stroke-dasharray="6 4"/>
      <line x1="500" y1="40" x2="680" y2="420" stroke="#00f0ff" stroke-width="1"/>
      <line x1="500" y1="40" x2="850" y2="420" stroke="#00f0ff" stroke-width="1"/>
      <line x1="500" y1="40" x2="1000" y2="420" stroke="#00f0ff" stroke-width="1"/>

      <!-- Transverse 3D grid lines -->
      <line x1="380" y1="120" x2="620" y2="120" stroke="#00f0ff" stroke-width="0.8"/>
      <line x1="260" y1="210" x2="740" y2="210" stroke="#00f0ff" stroke-width="0.8"/>
      <line x1="120" y1="310" x2="880" y2="310" stroke="#00f0ff" stroke-width="0.9"/>
      <line x1="0" y1="410" x2="1000" y2="410" stroke="#00ff66" stroke-width="1"/>
    </g>

    <!-- Depth darkening overlay -->
    <rect width="1000" height="420" fill="url(#depthFade)"/>

    <!-- Active Laser Sweeping Line (ANIMATED) -->
    <g class="laser-scan">
      <line x1="0" y1="0" x2="1000" y2="0" stroke="url(#scannerGrad)" stroke-width="1.8"/>
      <rect x="0" y="-12" width="1000" height="12" fill="#00ff66" opacity="0.04"/>
    </g>

    <!-- Terminal Titlebar / Header -->
    <rect width="1000" height="42" fill="#050c18"/>
    <line x1="0" y1="42" x2="1000" y2="42" stroke="#00ff66" stroke-width="1" stroke-opacity="0.4"/>
    <rect width="1000" height="2" fill="url(#headerGradHacker)"/>

    <!-- Sharp 90-degree Hacker Window Controls -->
    <g transform="translate(18, 14)">
      <rect x="0" y="0" width="14" height="14" fill="#ff4d4d" fill-opacity="0.2" stroke="#ff4d4d" stroke-width="1.2"/>
      <line x1="3" y1="3" x2="11" y2="11" stroke="#ff4d4d" stroke-width="1.2"/>
      <line x1="11" y1="3" x2="3" y2="11" stroke="#ff4d4d" stroke-width="1.2"/>

      <rect x="22" y="0" width="14" height="14" fill="#ffd700" fill-opacity="0.2" stroke="#ffd700" stroke-width="1.2"/>
      <rect x="25" y="3" width="8" height="8" fill="none" stroke="#ffd700" stroke-width="1.2"/>

      <rect x="44" y="0" width="14" height="14" fill="#00ff66" fill-opacity="0.2" stroke="#00ff66" stroke-width="1.2"/>
      <line x1="47" y1="10" x2="55" y2="10" stroke="#00ff66" stroke-width="1.4"/>
    </g>

    <!-- Window Title & Security Telemetry -->
    <text x="500" y="27" text-anchor="middle" fill="#00f0ff" class="header-mono" font-size="12" font-weight="700" letter-spacing="1.5">
      SYS_CONSOLE://HUEVANG_ROOT • [PORT:443 // TLS_1.3 // ENCRYPTED] • AGE:26 • 020 78849378
    </text>

    <!-- Live Terminal Activity Badge -->
    <g transform="translate(900, 13)">
      <rect x="0" y="0" width="82" height="18" fill="#00ff66" fill-opacity="0.15" stroke="#00ff66" stroke-width="1"/>
      <circle cx="10" cy="9" r="3" fill="#00ff66">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <text x="20" y="13" fill="#00ff66" class="header-mono" font-size="9" font-weight="700" letter-spacing="1">LIVE_CLI</text>
    </g>

    <!-- Terminal Lines -->
    <!-- Command 1: whoami -->
    <g style="animation: g0 16.5s linear infinite;">
      <text x="32" y="74" class="m">
        <tspan fill="#00ff66" font-weight="700">root@huevang:~$</tspan>
        <tspan fill="#00f0ff"> whoami</tspan>
      </text>
      <rect x="180" y="58" width="120" height="22" fill="#020408" style="transform-box: fill-box; transform-origin: right center; animation: c0 16.5s linear infinite;"/>
    </g>
    <g style="animation: g1 16.5s linear infinite;">
      <text x="32" y="100" class="m" fill="#ffffff" font-weight="600">Huevang XIONGPOR (26 y/o) — Senior Full-Stack Engineer &amp; Banking Systems Specialist</text>
    </g>

    <!-- Command 2: cat contact.info -->
    <g style="animation: g2 16.5s linear infinite;">
      <text x="32" y="128" class="m">
        <tspan fill="#00ff66" font-weight="700">root@huevang:~$</tspan>
        <tspan fill="#00f0ff"> cat /etc/telemetry/contact.info</tspan>
      </text>
      <rect x="330" y="112" width="220" height="22" fill="#020408" style="transform-box: fill-box; transform-origin: right center; animation: c2 16.5s linear infinite;"/>
    </g>
    <g style="animation: g3 16.5s linear infinite;">
      <text x="32" y="154" class="m">
        <tspan fill="#00f0ff">[TEL]:</tspan> <tspan fill="#ffffff">020 78849378</tspan>  <tspan fill="#64748b">|</tspan>  <tspan fill="#00f0ff">[MAIL]:</tspan> <tspan fill="#00ff66">huevang933@gmail.com</tspan>  <tspan fill="#64748b">|</tspan>  <tspan fill="#00f0ff">[LOC]:</tspan> <tspan fill="#ffffff">Vientiane Capital, Laos 🇱🇦</tspan>
      </text>
    </g>

    <!-- Command 3: cat education.txt -->
    <g style="animation: g4 16.5s linear infinite;">
      <text x="32" y="182" class="m">
        <tspan fill="#00ff66" font-weight="700">root@huevang:~$</tspan>
        <tspan fill="#00f0ff"> cat /var/log/education.log</tspan>
      </text>
      <rect x="290" y="166" width="210" height="22" fill="#020408" style="transform-box: fill-box; transform-origin: right center; animation: c4 16.5s linear infinite;"/>
    </g>
    <g style="animation: g5 16.5s linear infinite;">
      <text x="32" y="208" class="m" fill="#ffd700">Bachelor of Website Development — National University of Laos (NUOL • 2019–2023)</text>
    </g>

    <!-- Command 4: ls ~/skills -->
    <g style="animation: g6 16.5s linear infinite;">
      <text x="32" y="236" class="m">
        <tspan fill="#00ff66" font-weight="700">root@huevang:~$</tspan>
        <tspan fill="#00f0ff"> ls -la /usr/bin/arsenal</tspan>
      </text>
      <rect x="270" y="220" width="180" height="22" fill="#020408" style="transform-box: fill-box; transform-origin: right center; animation: c6 16.5s linear infinite;"/>
    </g>
    <g style="animation: g7 16.5s linear infinite;">
      <text x="32" y="262" class="m">
        <tspan fill="#00ff66">Vue3</tspan>  <tspan fill="#ffffff">Nuxt.js</tspan>  <tspan fill="#00f0ff">React Native</tspan>  <tspan fill="#ffd700">Node.js</tspan>  <tspan fill="#00ff66">Python</tspan>  <tspan fill="#ffffff">NestJS</tspan>  <tspan fill="#00f0ff">PHP/Laravel</tspan>  <tspan fill="#ffd700">PostgreSQL</tspan>  <tspan fill="#00ff66">Docker</tspan>  <tspan fill="#ffffff">Antigravity AI</tspan>
      </text>
    </g>

    <!-- Command 5: git status -->
    <g style="animation: g8 16.5s linear infinite;">
      <text x="32" y="290" class="m">
        <tspan fill="#00ff66" font-weight="700">root@huevang:~$</tspan>
        <tspan fill="#00f0ff"> git status --short</tspan>
      </text>
      <rect x="260" y="274" width="160" height="22" fill="#020408" style="transform-box: fill-box; transform-origin: right center; animation: c8 16.5s linear infinite;"/>
    </g>
    <g style="animation: g9 16.5s linear infinite;">
      <text x="32" y="316" class="m">
        <tspan fill="#00ff66">## main...origin/main [ahead 0]</tspan> <tspan fill="#ffffff">• 170+ repositories active • Open for enterprise contracts &amp; fintech engineering</tspan>
      </text>
    </g>

    <!-- Command 6: echo $MOTTO -->
    <g style="animation: g10 16.5s linear infinite;">
      <text x="32" y="344" class="m">
        <tspan fill="#00ff66" font-weight="700">root@huevang:~$</tspan>
        <tspan fill="#00f0ff"> echo $CORE_PHILOSOPHY</tspan>
      </text>
      <rect x="290" y="328" width="190" height="22" fill="#020408" style="transform-box: fill-box; transform-origin: right center; animation: c10 16.5s linear infinite;"/>
    </g>
    <g style="animation: g11 16.5s linear infinite;">
      <text x="32" y="370" class="m" fill="#ffd700" font-weight="600">"Excellence through clean architecture, continuous innovation &amp; uncompromising precision." ✨</text>
    </g>

    <!-- Active Blinking Prompt Line -->
    <text x="32" y="398" class="m">
      <tspan fill="#00ff66" font-weight="700">root@huevang:~$</tspan>
    </text>
    <rect x="180" y="384" width="10" height="18" fill="#00ff66" style="animation: blink 0.9s steps(1) infinite;"/>

    <!-- Sharp 90-Degree Cyber Brackets & Border -->
    <rect x="0.5" y="0.5" width="999" height="419" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.3"/>
    
    <!-- Cyber Corner Accents -->
    <path d="M 0 16 L 0 0 L 16 0" fill="none" stroke="#00ff66" stroke-width="2.5"/>
    <path d="M 984 0 L 1000 0 L 1000 16" fill="none" stroke="#00ff66" stroke-width="2.5"/>
    <path d="M 0 404 L 0 420 L 16 420" fill="none" stroke="#00ff66" stroke-width="2.5"/>
    <path d="M 984 420 L 1000 420 L 1000 404" fill="none" stroke="#00ff66" stroke-width="2.5"/>
  </g>
</svg>
