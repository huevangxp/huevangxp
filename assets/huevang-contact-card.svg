<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="Contact Huevang XIONGPOR - Direct Communications and Professional Engagement">
