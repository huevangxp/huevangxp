<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 88" width="1000" height="88" role="img" aria-label="Let's build something exceptional together">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&amp;family=Fira+Code:wght@600;700&amp;display=swap');
      .cta-title { font-family: 'Outfit', 'Segoe UI', Helvetica, sans-serif; }
      .cta-sub { font-family: 'Fira Code', Menlo, Consolas, monospace; }
    </style>
    <linearGradient id="ctaBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="ctaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04080c"/>
      <stop offset="50%" stop-color="#08141e"/>
      <stop offset="100%" stop-color="#03060a"/>
    </linearGradient>
  </defs>

  <!-- Sharp 1000px Container -->
  <rect x="1" y="1" width="998" height="86" fill="url(#ctaBg)" stroke="url(#ctaBorder)" stroke-width="1.8" stroke-opacity="0.6"/>

  <!-- Left Accent Tech Bracket -->
  <path d="M 24 22 L 14 22 L 14 66 L 24 66" fill="none" stroke="#2dd4bf" stroke-width="2"/>
  <!-- Right Accent Tech Bracket -->
  <path d="M 976 22 L 986 22 L 986 66 L 976 66" fill="none" stroke="#ffd700" stroke-width="2"/>

  <!-- Solid Text Content (NO GRADIENTS) -->
  <text x="500" y="38" text-anchor="middle" fill="#ffffff" class="cta-title" font-size="21" font-weight="900" letter-spacing="2">
    LET'S BUILD SOMETHING EXCEPTIONAL TOGETHER →
  </text>
  <text x="500" y="66" text-anchor="middle" fill="#ffd700" class="cta-sub" font-size="13.5" font-weight="600" letter-spacing="1">
    📞 020 78849378  •  ✉️ huevang933@gmail.com  •  VIENTIANE, LAOS
  </text>
</svg>