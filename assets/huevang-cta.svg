<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 88" width="1000" height="88" role="img" aria-label="Let's build something exceptional together">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&amp;family=Fira+Code:wght@600;700&amp;display=swap');
      .cta-title { font-family: 'Outfit', 'Segoe UI', Helvetica, sans-serif; }
      .cta-sub { font-family: 'Fira Code', Menlo, Consolas, monospace; }
    </style>
    <linearGradient id="ctaBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="ctaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020408"/>
      <stop offset="50%" stop-color="#07121c"/>
      <stop offset="100%" stop-color="#020407"/>
    </linearGradient>
  </defs>

  <!-- Sharp 1000px Container -->
  <rect x="1" y="1" width="998" height="86" fill="url(#ctaBg)" stroke="url(#ctaBorder)" stroke-width="1.8" stroke-opacity="0.6"/>

  <!-- Animated Marching Cyber Circuit Line -->
  <line x1="20" y1="84" x2="980" y2="84" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" values="0;28" dur="1.8s" repeatCount="indefinite"/>
  </line>

  <!-- Left Accent Tech Bracket with Pulsing Dot -->
  <path d="M 28 20 L 16 20 L 16 68 L 28 68" fill="none" stroke="#00f0ff" stroke-width="2"/>
  <circle cx="16" cy="44" r="3.5" fill="#00ff66">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Right Accent Tech Bracket with Pulsing Dot -->
  <path d="M 972 20 L 984 20 L 984 68 L 972 68" fill="none" stroke="#ffd700" stroke-width="2"/>
  <circle cx="984" cy="44" r="3.5" fill="#ffd700">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Solid Hacker Text Content -->
  <text x="500" y="38" text-anchor="middle" class="cta-title" font-size="20" font-weight="900" letter-spacing="2">
    <tspan fill="#ffffff">LET'S BUILD SOMETHING </tspan><tspan fill="#00ff66">EXCEPTIONAL</tspan><tspan fill="#ffd700"> TOGETHER →</tspan>
  </text>
  <text x="500" y="66" text-anchor="middle" fill="#00f0ff" class="cta-sub" font-size="13" font-weight="700" letter-spacing="1">
    [SYS_DISPATCH] 📞 020 78849378 • ✉️ huevang933@gmail.com • VIENTIANE, LAOS 🇱🇦
  </text>
</svg>