<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 96" width="620" height="96" role="img" aria-label="Let's build something together">
  <defs>
    <linearGradient id="ctaBorder" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0" spreadMethod="repeat">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="33%" stop-color="#ffd700"/>
      <stop offset="66%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="300 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ctaClip">
      <rect x="8" y="8" width="604" height="80"/>
    </clipPath>
    <filter id="ctaGlow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="604" height="80" fill="url(#ctaBorder)" filter="url(#ctaGlow)" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.75;0.4" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="8" y="8" width="604" height="80" fill="#060c12" stroke="url(#ctaBorder)" stroke-width="2.5"/>

  <g clip-path="url(#ctaClip)">
    <rect y="0" width="130" height="110" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-200;750" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="310" y="45" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI',Helvetica,Arial,'Noto Sans Lao',sans-serif" font-size="24" font-weight="900" letter-spacing="1">
    LET'S BUILD SOMETHING EXCEPTIONAL →
  </text>
  <text x="310" y="72" text-anchor="middle" fill="#ffd700" font-family="'Fira Code',Menlo,Consolas,monospace" font-size="14" font-weight="600" letter-spacing="1">
    📞 020 78849378  •  ✉️ huevang933@gmail.com
  </text>
</svg>