<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="Featured Enterprise Deployments and Production Repositories">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&amp;family=Fira+Code:wght@600;700&amp;display=swap');
      .head { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif; }
      .code { font-family: 'Fira Code', Menlo, Consolas, monospace; }
      .proj-card { transition: all 0.25s ease; cursor: pointer; }
      .proj-card:hover { opacity: 0.92; }
    </style>

    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020408"/>
      <stop offset="50%" stop-color="#050d17"/>
      <stop offset="100%" stop-color="#010305"/>
    </linearGradient>

    <linearGradient id="projBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <linearGradient id="gridFadeProj" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.25"/>
    </linearGradient>

    <pattern id="cardGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f0ff" stroke-width="0.7" stroke-opacity="0.05"/>
      <circle cx="0" cy="0" r="1.2" fill="#ffd700" fill-opacity="0.12"/>
    </pattern>

    <clipPath id="cardClip">
      <rect width="1000" height="440"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base Canvas Background -->
    <rect width="1000" height="440" fill="url(#cardBg)"/>
    <rect width="1000" height="440" fill="url(#cardGrid)"/>

    <!-- 3D Perspective Lines in Background -->
    <g opacity="0.6">
      <line x1="500" y1="120" x2="-80" y2="440" stroke="url(#gridFadeProj)" stroke-width="1.1"/>
      <line x1="500" y1="120" x2="180" y2="440" stroke="url(#gridFadeProj)" stroke-width="1.1"/>
      <line x1="500" y1="120" x2="380" y2="440" stroke="url(#gridFadeProj)" stroke-width="1.1"/>
      <line x1="500" y1="120" x2="620" y2="440" stroke="url(#gridFadeProj)" stroke-width="1.1"/>
      <line x1="500" y1="120" x2="820" y2="440" stroke="url(#gridFadeProj)" stroke-width="1.1"/>
      <line x1="500" y1="120" x2="1080" y2="440" stroke="url(#gridFadeProj)" stroke-width="1.1"/>
    </g>

    <!-- Animated Cyber Laser Scanner Line -->
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#00f0ff" stroke-width="1.3" stroke-opacity="0.35">
      <animate attributeName="y1" values="40;435;40" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="40;435;40" dur="8s" repeatCount="indefinite"/>
    </line>

    <!-- ════════════════════ TOP TERMINAL BAR ════════════════════ -->
    <rect width="1000" height="40" fill="#060e18"/>
    <line x1="0" y1="40" x2="1000" y2="40" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Window Dots -->
    <circle cx="26" cy="20" r="5.5" fill="#ff5f56"/>
    <circle cx="44" cy="20" r="5.5" fill="#ffbd2e"/>
    <circle cx="62" cy="20" r="5.5" fill="#00ff66"/>

    <!-- Title Bar Label -->
    <text x="500" y="25" text-anchor="middle" fill="#ffffff" class="head" font-size="13" font-weight="800" letter-spacing="2">
      ⚡ FEATURED ENTERPRISE DEPLOYMENTS &amp; CORE REPOSITORIES
    </text>

    <!-- Right Live Status Indicator (Matrix Green) -->
    <circle cx="848" cy="20" r="4" fill="#00ff66">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="860" y="24" fill="#00ff66" class="code" font-size="11" font-weight="700" letter-spacing="0.5">
      4_KEY_ARCHITECTURES
    </text>

    <!-- ════════════════════ PROJECT 1: MeUIPay ════════════════════ -->
    <g transform="translate(18, 52)" class="proj-card">
      <rect width="474" height="180" fill="#040a10" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.45"/>
      <!-- Top Tag & Status -->
      <rect x="14" y="12" width="165" height="22" fill="#071a1c" stroke="#00f0ff" stroke-width="0.9"/>
      <circle cx="24" cy="23" r="3" fill="#00ff66"/>
      <text x="94" y="27" text-anchor="middle" fill="#00f0ff" class="code" font-size="10" font-weight="700">[FINANCIAL_GATEWAY]</text>
      <text x="460" y="27" text-anchor="end" fill="#00ff66" class="code" font-size="10.5" font-weight="700">● LIVE_PROD</text>

      <!-- Title & Subtitle -->
      <text x="14" y="58" fill="#ffffff" class="head" font-size="18" font-weight="900" letter-spacing="0.5">💳 MeUIPay</text>
      <text x="14" y="78" fill="#ffd700" class="head" font-size="12" font-weight="600">Digital Banking &amp; High-Speed Payment Interface</text>

      <!-- Stack Badges -->
      <g transform="translate(14, 90)">
        <rect width="52" height="20" fill="#08141d" stroke="#00f0ff" stroke-width="0.8"/>
        <text x="26" y="14" text-anchor="middle" fill="#ffffff" class="code" font-size="10" font-weight="700">Vue 3</text>

        <rect x="58" width="80" height="20" fill="#08141d" stroke="#00f0ff" stroke-width="0.8"/>
        <text x="98" y="14" text-anchor="middle" fill="#ffffff" class="code" font-size="10" font-weight="700">TypeScript</text>

        <rect x="144" width="62" height="20" fill="#08141d" stroke="#ffd700" stroke-width="0.8"/>
        <text x="175" y="14" text-anchor="middle" fill="#ffffff" class="code" font-size="10" font-weight="700">Node.js</text>

        <rect x="212" width="76" height="20" fill="#08141d" stroke="#ffd700" stroke-width="0.8"/>
        <text x="250" y="14" text-anchor="middle" fill="#ffffff" class="code" font-size="10" font-weight="700">REST APIs</text>

        <rect x="294" width="60" height="20" fill="#08141d" stroke="#00ff66" stroke-width="0.8"/>
        <text x="324" y="14" text-anchor="middle" fill="#ffffff" class="code" font-size="10" font-weight="700">Tailwind</text>
      </g>

      <!-- Description -->
      <text x="14" y="134" fill="#cbd5e1" class="head" font-size="11.5">
        Secure multi-currency payment gateway and core settlement dashboard
      </text>
      <text x="14" y="152" fill="#00ff66" class="code" font-size="11.5">
        architected for financial transaction throughput and modular UI integration.
      </text>
    </g>

    <!-- ════════════════════ PROJECT 2: booking-apartment ════════════════════ -->
    <g transform="translate(508, 52)" class="proj-card">
      <rect width="474" height="180" fill="#040a10" stroke="#ffd700" stroke-width="1.2" stroke-opacity="0.45"/>
      <!-- Top Tag & Status -->
      <rect x="14" y="12" width="160" height="22" fill="#181506" stroke="#ffd700" stroke-width="0.9"/>
      <circle cx="24" cy="23" r="3" fill="#ffd700"/>
      <text x="92" y="27" text-anchor="middle" fill="#ffd700" class="code" font-size="10" font-weight="700">[PORTAL_ECOSYSTEM]</text>
      <text x="460" y="27" text-anchor="end" fill="#ffd700" class="code" font-size="10.5" font-weight="700">● STABLE</text>

      <!-- Title & Subtitle -->
      <text x="14" y="58" fill="#ffffff" class="head" font-size="18" font-weight="900" letter-spacing="0.5">🏢 booking-apartment</text>
      <text x="14" y="78" fill="#00f0ff" class="head" font-size="12" font-weight="600">Real Estate Reservation &amp; Tenancy Management</text>

      <!-- Stack Badges -->
      <g transform="translate(14, 90)">
        <rect width="58" height="20" fill="#08141d" stroke="#00f0ff" stroke-width="0.8"/>
        <text x="29" y="14" text-anchor="middle" fill="#ffffff" class="code" font-size="10" font-weight="700">Vue.js</text>

        <rect x="64" width="54" height="20" fill="#08141d" stroke="#00f0ff" stroke-width="0.8"/>
        <text x="91" y="14" text-anchor="middle" fill="#ffffff" class="code" font-size="10" font-weight="700">Nuxt</text>

        <rect x="124" width="56" height="20" fill="#08141d" stroke="#ffd700" stroke-width="0.8"/>
        <text x="152" y="14" text-anchor="middle" fill="#ffffff" class="code" font-size="10" font-weight="700">MySQL</text>

        <rect x="186" width="60" height="20" fill="#08141d" stroke="#ffd700" stroke-width="0.8"/>
        <text x="216" y="14" text-anchor="middle" fill="#ffffff" class="code" font-size="10" font-weight="700">Express</text>

        <rect x="252" width="76" height="20" fill="#08141d" stroke="#00ff66" stroke-width="0.8"/>
        <text x="290" y="14" text-anchor="middle" fill="#ffffff" class="code" font-size="10" font-weight="700">TailwindCSS</text>
      </g>

      <!-- Description -->
      <text x="14" y="134" fill="#cbd5e1" class="head" font-size="11.5">
        End-to-end apartment booking engine with dynamic room availability,
      </text>
      <text x="14" y="152" fill="#ffd700" class="code" font-size="11.5">
        lease management, tenant scheduling, and automated billing generation.
      </text>
    </g>

    <!-- ════════════════════ PROJECT 3: ai_server ════════════════════ -->
    <g transform="translate(18, 244)" class="proj-card">
      <rect width="474" height="180" fill="#040a10" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.45"/>
      <!-- Top Tag & Status -->
      <rect x="14" y="12" width="165" height="22" fill="#071a1c" stroke="#00f0ff" stroke-width="0.9"/>
      <circle cx="24" cy="23" r="3" fill="#00ff66"/>
      <text x="94" y="27" text-anchor="middle" fill="#00f0ff" class="code" font-size="10" font-weight="700">[AI_INFRASTRUCTURE]</text>
      <text x="460" y="27" text-anchor="end" fill="#00ff66" class="code" font-size="10.5" font-weight="700">● PIPELINE</text>

      <!-- Title & Subtitle -->
      <text x="14" y="58" fill="#ffffff" class="head" font-size="18" font-weight="900" letter-spacing="0.5">🤖 ai_server</text>
      <text x="14" y="78" fill="#ffd700" class="head" font-size="12" font-weight="600">Model Inference &amp; Autonomous Agent Backend</text>

      <!-- Stack Badges -->
      <g transform="translate(14, 90)">
        <rect width="58" height="20" fill="#08141d" stroke="#00f0ff" stroke-width="0.8"/>
        <text x="29" y="14" text-anchor="middle" fill="#ffffff" class="code" font-size="10" font-weight="700">Python</text>

        <rect x="64" width="60" height="20" fill="#08141d" stroke="#00f0ff" stroke-width="0.8"/>
        <text x="94" y="14" text-anchor="middle" fill="#ffffff" class="code" font-size="10" font-weight="700">FastAPI</text>

        <rect x="130" width="76" height="20" fill="#08141d" stroke="#ffd700" stroke-width="0.8"/>
        <text x="168" y="14" text-anchor="middle" fill="#ffffff" class="code" font-size="10" font-weight="700">AI Agents</text>

        <rect x="212" width="56" height="20" fill="#08141d" stroke="#00ff66" stroke-width="0.8"/>
        <text x="240" y="14" text-anchor="middle" fill="#ffffff" class="code" font-size="10" font-weight="700">Docker</text>

        <rect x="274" width="74" height="20" fill="#08141d" stroke="#a855f7" stroke-width="0.8"/>
        <text x="311" y="14" text-anchor="middle" fill="#ffffff" class="code" font-size="10" font-weight="700">Vector DB</text>
      </g>

      <!-- Description -->
      <text x="14" y="134" fill="#cbd5e1" class="head" font-size="11.5">
        Scalable microservice server powering large language model inferences,
      </text>
      <text x="14" y="152" fill="#00ff66" class="code" font-size="11.5">
        autonomous agent tool executions, and high-dimensional semantic search.
      </text>
    </g>

    <!-- ════════════════════ PROJECT 4: admin ════════════════════ -->
    <g transform="translate(508, 244)" class="proj-card">
      <rect width="474" height="180" fill="#040a10" stroke="#ffd700" stroke-width="1.2" stroke-opacity="0.45"/>
      <!-- Top Tag & Status -->
      <rect x="14" y="12" width="160" height="22" fill="#181506" stroke="#ffd700" stroke-width="0.9"/>
      <circle cx="24" cy="23" r="3" fill="#ffd700"/>
      <text x="92" y="27" text-anchor="middle" fill="#ffd700" class="code" font-size="10" font-weight="700">[ENTERPRISE_ADMIN]</text>
      <text x="460" y="27" text-anchor="end" fill="#00ff66" class="code" font-size="10.5" font-weight="700">● RBAC_SYS</text>

      <!-- Title & Subtitle -->
      <text x="14" y="58" fill="#ffffff" class="head" font-size="18" font-weight="900" letter-spacing="0.5">🛡️ admin</text>
      <text x="14" y="78" fill="#00f0ff" class="head" font-size="12" font-weight="600">Multi-Tenant Operations &amp; Control Dashboard</text>

      <!-- Stack Badges -->
      <g transform="translate(14, 90)">
        <rect width="52" height="20" fill="#08141d" stroke="#00f0ff" stroke-width="0.8"/>
        <text x="26" y="14" text-anchor="middle" fill="#ffffff" class="code" font-size="10" font-weight="700">Vue 3</text>

        <rect x="58" width="80" height="20" fill="#08141d" stroke="#00f0ff" stroke-width="0.8"/>
        <text x="98" y="14" text-anchor="middle" fill="#ffffff" class="code" font-size="10" font-weight="700">TypeScript</text>

        <rect x="144" width="58" height="20" fill="#08141d" stroke="#ffd700" stroke-width="0.8"/>
        <text x="173" y="14" text-anchor="middle" fill="#ffffff" class="code" font-size="10" font-weight="700">NestJS</text>

        <rect x="208" width="82" height="20" fill="#08141d" stroke="#38bdf8" stroke-width="0.8"/>
        <text x="249" y="14" text-anchor="middle" fill="#ffffff" class="code" font-size="10" font-weight="700">PostgreSQL</text>

        <rect x="296" width="50" height="20" fill="#08141d" stroke="#00ff66" stroke-width="0.8"/>
        <text x="321" y="14" text-anchor="middle" fill="#ffffff" class="code" font-size="10" font-weight="700">RBAC</text>
      </g>

      <!-- Description -->
      <text x="14" y="134" fill="#cbd5e1" class="head" font-size="11.5">
        Mission-critical administrative management portal with granular role permissions,
      </text>
      <text x="14" y="152" fill="#ffd700" class="code" font-size="11.5">
        real-time telemetry charts, immutable audit logging, and user controls.
      </text>
    </g>

    <!-- Outer Luxury Border (Sharp 90-degree corners) -->
    <rect x="1" y="1" width="998" height="438" fill="none" stroke="url(#projBorder)" stroke-width="1.8" stroke-opacity="0.6"/>
  </g>
</svg>