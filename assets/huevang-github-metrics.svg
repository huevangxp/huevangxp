<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 395" width="1000" height="395" role="img" aria-label="Huevang XIONGPOR GitHub Engineering Metrics and Verified Activity">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&amp;family=Fira+Code:wght@600;700&amp;family=Share+Tech+Mono&amp;display=swap');
      .head { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif; }
      .code { font-family: 'Fira Code', Menlo, Consolas, monospace; }
      .mono { font-family: 'Share Tech Mono', 'Fira Code', monospace; }
      @keyframes laserMove {
        0% { y1: 42; y2: 42; opacity: 0.15; }
        50% { opacity: 0.9; }
        100% { y1: 393; y2: 393; opacity: 0.15; }
      }
      .laser-scanner {
        animation: laserMove 6.5s linear infinite;
      }
    </style>

    <!-- Deep Obsidian Canvas Gradient -->
    <linearGradient id="metricsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020408"/>
      <stop offset="50%" stop-color="#050d17"/>
      <stop offset="100%" stop-color="#010305"/>
    </linearGradient>

    <!-- Unified 3-Color Header Gradient (Cyan -> Green -> Gold) -->
    <linearGradient id="triColorGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>

    <linearGradient id="gridFadeMetrics" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.16"/>
    </linearGradient>

    <pattern id="metricsGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f0ff" stroke-width="0.7" stroke-opacity="0.05"/>
      <circle cx="0" cy="0" r="1.2" fill="#00ff66" fill-opacity="0.12"/>
    </pattern>

    <clipPath id="metricsClip">
      <rect width="1000" height="395"/>
    </clipPath>
  </defs>

  <g clip-path="url(#metricsClip)">
    <!-- Base Canvas Background -->
    <rect width="1000" height="395" fill="url(#metricsBg)"/>
    <rect width="1000" height="395" fill="url(#metricsGrid)"/>

    <!-- 3D Depth Perspective Floor Lines (Color 1: Cyber Cyan #00f0ff) -->
    <g opacity="0.6">
      <line x1="500" y1="130" x2="-80" y2="395" stroke="url(#gridFadeMetrics)" stroke-width="1.1"/>
      <line x1="500" y1="130" x2="180" y2="395" stroke="url(#gridFadeMetrics)" stroke-width="1.1"/>
      <line x1="500" y1="130" x2="380" y2="395" stroke="url(#gridFadeMetrics)" stroke-width="1.1"/>
      <line x1="500" y1="130" x2="620" y2="395" stroke="url(#gridFadeMetrics)" stroke-width="1.1"/>
      <line x1="500" y1="130" x2="820" y2="395" stroke="url(#gridFadeMetrics)" stroke-width="1.1"/>
      <line x1="500" y1="130" x2="1080" y2="395" stroke="url(#gridFadeMetrics)" stroke-width="1.1"/>
    </g>

    <!-- Animated Cyber Laser Scanner Line (Color 1: Cyber Cyan #00f0ff) -->
    <line x1="0" y1="42" x2="1000" y2="42" stroke="#00f0ff" stroke-width="1.4" stroke-opacity="0.6" class="laser-scanner"/>

    <!-- ════════════════════ TOP TERMINAL BAR ════════════════════ -->
    <rect width="1000" height="42" fill="#050c18"/>
    <line x1="0" y1="42" x2="1000" y2="42" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.3"/>
    <rect width="1000" height="2" fill="url(#triColorGrad)"/>

    <!-- Sharp 90-degree Hacker Window Buttons (Strictly Color 1, 2, 3) -->
    <g transform="translate(18, 14)">
      <!-- Button 1: Cyan -->
      <rect x="0" y="0" width="14" height="14" fill="#00f0ff" fill-opacity="0.15" stroke="#00f0ff" stroke-width="1.2"/>
      <line x1="3" y1="10" x2="11" y2="10" stroke="#00f0ff" stroke-width="1.4"/>

      <!-- Button 2: Green -->
      <rect x="22" y="0" width="14" height="14" fill="#00ff66" fill-opacity="0.15" stroke="#00ff66" stroke-width="1.2"/>
      <rect x="25" y="3" width="8" height="8" fill="none" stroke="#00ff66" stroke-width="1.2"/>

      <!-- Button 3: Gold -->
      <rect x="44" y="0" width="14" height="14" fill="#ffd700" fill-opacity="0.15" stroke="#ffd700" stroke-width="1.2"/>
      <line x1="47" y1="4" x2="55" y2="10" stroke="#ffd700" stroke-width="1.2"/>
      <line x1="55" y1="4" x2="47" y2="10" stroke="#ffd700" stroke-width="1.2"/>
    </g>

    <!-- Title Bar Label (Color 1: Cyber Cyan) -->
    <text x="500" y="27" text-anchor="middle" fill="#00f0ff" class="mono" font-size="12" font-weight="700" letter-spacing="1.5">
      GITHUB_TELEMETRY://HUEVANGXP • [30,278 CONTRIBUTIONS IN LAST YEAR // 170+ REPOSITORIES]
    </text>

    <!-- Right Live Status Indicator (Color 2: Matrix Green) -->
    <g transform="translate(840, 13)">
      <rect x="0" y="0" width="142" height="18" fill="#00ff66" fill-opacity="0.12" stroke="#00ff66" stroke-width="1"/>
      <circle cx="10" cy="9" r="3" fill="#00ff66">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="20" y="13" fill="#00ff66" class="code" font-size="9.5" font-weight="700" letter-spacing="0.5">
        30,278 NODES LIVE
      </text>
    </g>

    <!-- ════════════════════ 4 KEY METRIC TILES (STRICT 3 COLORS) ════════════════════ -->
    <!-- Tile 1: Total Verified Contributions (Color 2: Matrix Green #00ff66) -->
    <g transform="translate(18, 54)">
      <rect width="232" height="88" fill="#040a10" stroke="#00ff66" stroke-width="1.2" stroke-opacity="0.6"/>
      <rect x="12" y="10" width="150" height="20" fill="#071e11" stroke="#00ff66" stroke-width="0.8"/>
      <text x="22" y="24" fill="#00ff66" class="code" font-size="10" font-weight="700">● 0xCONTRIBUTIONS</text>
      <text x="14" y="60" fill="#00ff66" class="head" font-size="28" font-weight="900" letter-spacing="0.5">30 278</text>
      <text x="14" y="76" fill="#ffffff" class="code" font-size="10.5">In The Last Year Output</text>
    </g>

    <!-- Tile 2: Total Repositories (Color 3: Electric Gold #ffd700) -->
    <g transform="translate(262, 54)">
      <rect width="232" height="88" fill="#040a10" stroke="#ffd700" stroke-width="1.2" stroke-opacity="0.5"/>
      <rect x="12" y="10" width="140" height="20" fill="#181506" stroke="#ffd700" stroke-width="0.8"/>
      <text x="22" y="24" fill="#00ff66" class="code" font-size="10" font-weight="700">● 0xREPOSITORIES</text>
      <text x="14" y="60" fill="#00ff66" class="head" font-size="28" font-weight="900" letter-spacing="0.5">170+</text>
      <text x="14" y="76" fill="#ffffff" class="code" font-size="10.5">Public &amp; Enterprise Repos</text>
    </g>

    <!-- Tile 3: Tenure / Experience (Color 1: Cyber Cyan #00f0ff) -->
    <g transform="translate(506, 54)">
      <rect width="232" height="88" fill="#040a10" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.5"/>
      <rect x="12" y="10" width="135" height="20" fill="#071a1c" stroke="#00f0ff" stroke-width="0.8"/>
      <text x="22" y="24" fill="#00f0ff" class="code" font-size="10" font-weight="700">● 0xACTIVE_TENURE</text>
      <text x="14" y="60" fill="#ffffff" class="head" font-size="28" font-weight="900" letter-spacing="0.5">5+ Years</text>
      <text x="14" y="76" fill="#ffffff" class="code" font-size="10.5">Member Since Dec 12, 2019</text>
    </g>

    <!-- Tile 4: Official Badges (Color 2: Matrix Green #00ff66) -->
    <g transform="translate(750, 54)">
      <rect width="232" height="88" fill="#040a10" stroke="#00ff66" stroke-width="1.2" stroke-opacity="0.5"/>
      <rect x="12" y="10" width="155" height="20" fill="#071e11" stroke="#00ff66" stroke-width="0.8"/>
      <text x="22" y="24" fill="#00ff66" class="code" font-size="10" font-weight="700">● 0xOFFICIAL_BADGES</text>
