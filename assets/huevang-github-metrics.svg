    <!-- Outer Sharp 90-degree Border (Cyber Cyan + Matrix Green Brackets) -->
    <rect x="0.5" y="0.5" width="999" height="394" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.3"/>
    <path d="M 0 16 L 0 0 L 16 0" fill="none" stroke="#00ff66" stroke-width="2.5"/>
    <path d="M 984 0 L 1000 0 L 1000 16" fill="none" stroke="#00ff66" stroke-width="2.5"/>
    <path d="M 0 378 L 0 394 L 16 394" fill="none" stroke="#00ff66" stroke-width="2.5"/>
    <path d="M 984 394 L 1000 394 L 1000 378" fill="none" stroke="#00ff66" stroke-width="2.5"/>
  </g>
</svg>
