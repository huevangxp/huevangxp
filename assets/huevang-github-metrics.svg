    <!-- Left Panel: Language Breakdown (Only reusing #00f0ff, #00ff66, #ffd700) -->
    <g transform="translate(18, 154)">
      <rect width="476" height="224" fill="#040a10" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.35"/>
      
      <!-- Panel Header -->
      <rect x="0" y="0" width="476" height="32" fill="#06121e"/>
      <line x1="0" y1="32" x2="476" y2="32" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.25"/>
      <text x="16" y="21" fill="#00f0ff" class="code" font-size="11.5" font-weight="700" letter-spacing="1">
        [SYS] RUNTIME DISTRIBUTION (30,278 CONTRIBUTION SAMPLE)
      </text>

      <!-- Multi-Segment Distribution Bar (Reusing strictly Cyan, Green, Gold) -->
      <g transform="translate(16, 44)">
        <rect width="444" height="12" fill="#0b1723"/>
        <!-- JavaScript: Gold -->
        <rect x="0" width="186" height="12" fill="#ffd700"/>
        <!-- Batchfile: Green -->
        <rect x="187" width="115" height="12" fill="#00ff66"/>
        <!-- Vue: Cyan -->
        <rect x="303" width="71" height="12" fill="#00f0ff"/>
        <!-- HTML: Gold -->
        <rect x="375" width="44" height="12" fill="#ffd700"/>
        <!-- Python: Green -->
        <rect x="420" width="24" height="12" fill="#00ff66"/>
      </g>

      <!-- Language Item 1: JavaScript (Gold) -->
      <g transform="translate(16, 70)">
        <rect x="0" y="2" width="10" height="10" fill="#ffd700"/>
        <text x="18" y="11" fill="#ffffff" class="head" font-size="12" font-weight="700">JavaScript</text>
        <text x="444" y="11" text-anchor="end" fill="#00ff66" class="code" font-size="11.5" font-weight="700">42%</text>
        <text x="18" y="25" fill="#ffffff" class="head" font-size="10.5">Frontend reactive logic, Node runtimes &amp; client components</text>
      </g>

      <!-- Language Item 2: Batchfile (Green) -->
      <g transform="translate(16, 104)">
        <rect x="0" y="2" width="10" height="10" fill="#00ff66"/>
        <text x="18" y="11" fill="#ffffff" class="head" font-size="12" font-weight="700">Batchfile Automation</text>
        <text x="444" y="11" text-anchor="end" fill="#00ff66" class="code" font-size="11.5" font-weight="700">26%</text>
        <text x="18" y="25" fill="#ffffff" class="head" font-size="10.5">Windows Server orchestration, background triggers &amp; CI tasks</text>
      </g>

      <!-- Language Item 3: Vue (Cyan) -->
      <g transform="translate(16, 138)">
        <rect x="0" y="2" width="10" height="10" fill="#00f0ff"/>
        <text x="18" y="11" fill="#ffffff" class="head" font-size="12" font-weight="700">Vue.js &amp; Nuxt Ecosystem</text>
        <text x="444" y="11" text-anchor="end" fill="#00f0ff" class="code" font-size="11.5" font-weight="700">16%</text>
        <text x="18" y="25" fill="#ffffff" class="head" font-size="10.5">Banking dashboards, interactive portals &amp; SSR applications</text>
      </g>

      <!-- Language Item 4: HTML & Python (Gold & Green) -->
      <g transform="translate(16, 172)">
        <rect x="0" y="2" width="10" height="10" fill="#ffd700"/>
        <text x="18" y="11" fill="#ffffff" class="head" font-size="12" font-weight="700">HTML5 (10%) &amp; Python (6%)</text>
        <text x="444" y="11" text-anchor="end" fill="#00ff66" class="code" font-size="11.5" font-weight="700">16%</text>
        <text x="18" y="25" fill="#ffffff" class="head" font-size="10.5">Canvas APIs, semantic web structures &amp; Python microservices</text>
      </g>
    </g>

    <!-- Right Panel: Engineering Velocity & Pillars (Reusing Cyan, Green, Gold) -->
    <g transform="translate(506, 154)">
      <rect width="476" height="224" fill="#040a10" stroke="#00ff66" stroke-width="1" stroke-opacity="0.35"/>
      
      <!-- Panel Header -->
      <rect x="0" y="0" width="476" height="32" fill="#06121e"/>
      <line x1="0" y1="32" x2="476" y2="32" stroke="#00ff66" stroke-width="1" stroke-opacity="0.25"/>
      <text x="16" y="21" fill="#00ff66" class="code" font-size="11.5" font-weight="700" letter-spacing="1">
        [OPS] ENGINEERING CADENCE &amp; CONTRIBUTION RADAR
      </text>

      <!-- Pillar 1: High Commit Velocity (Green) -->
      <g transform="translate(16, 44)">
        <rect x="0" y="2" width="8" height="8" fill="#00ff66"/>
        <text x="16" y="10" fill="#ffffff" class="head" font-size="12.5" font-weight="800">
          Massive Velocity (30,278 Contributions in Last Year)
        </text>
        <text x="16" y="26" fill="#ffffff" class="head" font-size="11">
          High-frequency engineering across daily production branches, banking pipelines,
        </text>
        <text x="16" y="41" fill="#00ff66" class="code" font-size="11">
          and robust automated deployment systems.
        </text>
      </g>

      <!-- Pillar 2: Scalable Portals & Open Source (Gold) -->
      <g transform="translate(16, 102)">
        <rect x="0" y="2" width="8" height="8" fill="#ffd700"/>
        <text x="16" y="10" fill="#ffffff" class="head" font-size="12.5" font-weight="800">
          170+ Multi-Repo Scalability &amp; Architecture
        </text>
        <text x="16" y="26" fill="#ffffff" class="head" font-size="11">
          Architectural lead across 170+ repositories with automated workflows,
        </text>
        <text x="16" y="41" fill="#00ff66" class="code" font-size="11">
          dockerized runtime environments, and microservice APIs.
        </text>
      </g>

      <!-- Pillar 3: Recognized GitHub Honors (Cyan) -->
      <g transform="translate(16, 160)">
        <rect x="0" y="2" width="8" height="8" fill="#00f0ff"/>
        <text x="16" y="10" fill="#ffffff" class="head" font-size="12.5" font-weight="800">
          Official Badges: Pull Shark • Quickdraw • YOLO
        </text>
        <text x="16" y="26" fill="#ffffff" class="head" font-size="11">
          Recognized for rapid PR merging &amp; continuous delivery.
        </text>
        <text x="16" y="41" fill="#00f0ff" class="code" font-size="11">
