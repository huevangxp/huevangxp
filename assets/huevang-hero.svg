<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Huevang XIONGPOR - Full-Stack Developer">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@500;700;800;900&amp;family=Outfit:wght@600;700;800;900&amp;family=Fira+Code:wght@500;700&amp;display=swap');
      .font-lao { font-family: 'Noto Sans Lao', 'Segoe UI Lao', 'Leelawadee UI', sans-serif; }
      .font-main { font-family: 'Outfit', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .font-code { font-family: 'Fira Code', Menlo, Consolas, monospace; }
    </style>

    <linearGradient id="heroDarkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04080c"/>
      <stop offset="50%" stop-color="#08141d"/>
      <stop offset="100%" stop-color="#020406"/>
    </linearGradient>

    <linearGradient id="heroBorderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>

    <!-- Subtle Ambient Radial Lights (Backdrop only, not on text) -->
    <radialGradient id="tealAmbient">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldAmbient">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>

    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2dd4bf" stroke-width="0.8" stroke-opacity="0.06"/>
      <circle cx="0" cy="0" r="1.2" fill="#ffd700" fill-opacity="0.14"/>
    </pattern>

    <clipPath id="heroCardClip">
      <rect width="1000" height="360" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#heroCardClip)">
    <!-- Deep Obsidian Backdrop -->
    <rect width="1000" height="360" fill="url(#heroDarkBg)"/>
    <rect width="1000" height="360" fill="url(#techGrid)"/>

    <!-- Subtle Ambient Backdrop Glows -->
    <circle cx="200" cy="120" r="240" fill="url(#tealAmbient)"/>
    <circle cx="800" cy="220" r="220" fill="url(#goldAmbient)"/>

    <!-- Top Lao & English Greeting Pill -->
    <g transform="translate(500, 48)">
      <rect x="-240" y="-16" width="480" height="32" rx="16" fill="#08141e" stroke="#2dd4bf" stroke-width="1.2" stroke-opacity="0.5"/>
      <circle cx="-214" cy="0" r="4.5" fill="#2dd4bf">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="12" y="5" text-anchor="middle" fill="#ffffff" class="font-lao" font-size="12.5" font-weight="700" letter-spacing="1">
        ສະບາຍດີ! 🙏 SABAYDEE • FULL-STACK &amp; BANKING ARCHITECT
      </text>
    </g>

    <!-- Main Name Title — Pure Solid Crisp Typography (NO GRADIENTS) -->
    <text x="500" y="142" text-anchor="middle" class="font-main" font-size="52" font-weight="900" letter-spacing="3">
      <tspan fill="#ffffff">HUEVANG</tspan> <tspan fill="#ffd700">XIONGPOR</tspan>
    </text>

    <!-- Animated Cycling Role Headings — Crisp Solid Colors -->
    <text x="500" y="200" text-anchor="middle" fill="#ffffff" class="font-code" font-size="21" font-weight="600" letter-spacing="1.5" opacity="0">
      &lt; Full-Stack Developer &amp; Enterprise Solutions /&gt;
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.00;0.05;0.28;0.33;1.00" dur="10s" repeatCount="indefinite"/>
    </text>

    <text x="500" y="200" text-anchor="middle" fill="#ffd700" class="font-code" font-size="21" font-weight="600" letter-spacing="1.5" opacity="0">
      &lt; Banking Systems &amp; Core Fintech Specialist /&gt;
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.00;0.33;0.38;0.61;0.66;1.00" dur="10s" repeatCount="indefinite"/>
    </text>

    <text x="500" y="200" text-anchor="middle" fill="#2dd4bf" class="font-lao" font-size="20" font-weight="700" letter-spacing="1" opacity="0">
      &lt; ນັກພັດທະນາເວັບໄຊ, ແອັບມືຖື ແລະ ລະບົບທະນາຄານ /&gt;
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.00;0.66;0.71;0.95;1.00" dur="10s" repeatCount="indefinite"/>
    </text>

    <!-- Subtitle with Lao & English — Solid Slate Muted -->
    <text x="500" y="238" text-anchor="middle" fill="#94a3b8" class="font-lao" font-size="14" letter-spacing="0.5">
      ສ້າງສັນລະບົບຊອບແວທີ່ປອດໄພ, ວ່ອງໄວ ແລະ ຕອບໂຈດທຸລະກິດ • Vientiane, Laos 🇱🇦
    </text>

    <!-- Clean Gold Divider Line -->
    <line x1="200" y1="262" x2="800" y2="262" stroke="#ffd700" stroke-width="1.2" stroke-opacity="0.35"/>

    <!-- Bottom Metadata Badge Strip — Crisp Solid Badges -->
    <g transform="translate(500, 302)">
      <!-- Location Badge -->
      <g transform="translate(-320, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#081017" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.5"/>
        <text x="0" y="5" text-anchor="middle" fill="#ffffff" class="font-main" font-size="12" font-weight="600">
          📍 Vientiane, Laos 🇱🇦
        </text>
      </g>

      <!-- Age Badge -->
      <g transform="translate(-120, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#081017" stroke="#ffd700" stroke-width="1" stroke-opacity="0.6"/>
        <text x="0" y="5" text-anchor="middle" fill="#ffd700" class="font-main" font-size="12" font-weight="700">
          🎂 Age: 26 Years
        </text>
      </g>

      <!-- Phone Badge -->
      <g transform="translate(90, 0)">
        <rect x="-95" y="-16" width="190" height="32" rx="16" fill="#081017" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.5"/>
        <text x="0" y="5" text-anchor="middle" fill="#ffffff" class="font-code" font-size="12" font-weight="600">
          📞 020 78849378
        </text>
      </g>

      <!-- Email Badge -->
      <g transform="translate(315, 0)">
        <rect x="-105" y="-16" width="210" height="32" rx="16" fill="#081017" stroke="#ffd700" stroke-width="1" stroke-opacity="0.6"/>
        <text x="0" y="5" text-anchor="middle" fill="#ffd700" class="font-code" font-size="11.5" font-weight="600">
          ✉️ huevang933@gmail.com
        </text>
      </g>
    </g>

    <!-- Outer Luxury Border -->
    <rect x="1" y="1" width="998" height="358" rx="17" fill="none" stroke="url(#heroBorderGrad)" stroke-width="1.8" stroke-opacity="0.5"/>
  </g>
</svg>