<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Huevang XIONGPOR - Full-Stack Developer">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700;800;900&amp;family=Outfit:wght@400;600;700;800;900&amp;family=Fira+Code:wght@500;700&amp;display=swap');
      .font-lao { font-family: 'Noto Sans Lao', 'Segoe UI Lao', 'Leelawadee UI', sans-serif; }
      .font-main { font-family: 'Outfit', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .font-code { font-family: 'Fira Code', Menlo, Consolas, monospace; }
    </style>

    <linearGradient id="darkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04080c"/>
      <stop offset="0.5" stop-color="#08131a"/>
      <stop offset="1" stop-color="#020406"/>
    </linearGradient>

    <!-- Teal & Gold Luxe Name Gradient -->
    <linearGradient id="nameGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf">
        <animate attributeName="stop-color" values="#2dd4bf;#ffd700;#ffffff;#2dd4bf" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="45%" stop-color="#ffd700">
        <animate attributeName="stop-color" values="#ffd700;#ffffff;#2dd4bf;#ffd700" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="75%" stop-color="#ffffff">
        <animate attributeName="stop-color" values="#ffffff;#2dd4bf;#ffd700;#ffffff" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#14b8a6">
        <animate attributeName="stop-color" values="#14b8a6;#ffd700;#ffffff;#14b8a6" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Teal Accent Gradient -->
    <linearGradient id="tealGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#008080"/>
    </linearGradient>

    <!-- Light Orbs -->
    <radialGradient id="tealOrb">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldOrb">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanOrb">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>

    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.06"/>
      <circle cx="0" cy="0" r="1.5" fill="#ffd700" fill-opacity="0.18"/>
    </pattern>

    <filter id="luxeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="cardRadius">
      <rect width="1000" height="360" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardRadius)">
    <!-- Deep Obsidian Backdrop -->
    <rect width="1000" height="360" fill="url(#darkBg)"/>
    <rect width="1000" height="360" fill="url(#techGrid)"/>

    <!-- Drifting Ambient Light Orbs -->
    <circle r="210" fill="url(#tealOrb)">
      <animate attributeName="cx" values="180;360;180" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;250;90" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle r="190" fill="url(#goldOrb)">
      <animate attributeName="cx" values="780;540;780" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="240;80;240" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="160" fill="url(#cyanOrb)">
      <animate attributeName="cx" values="500;680;500" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;220;60" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- Top Lao & English Greeting Bar -->
    <g transform="translate(500, 48)">
      <rect x="-240" y="-16" width="480" height="32" rx="16" fill="#0d1822" stroke="#2dd4bf" stroke-width="1.2" stroke-opacity="0.4"/>
      <circle cx="-215" cy="0" r="5" fill="#2dd4bf">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="12" y="5" text-anchor="middle" fill="#ffffff" class="font-lao" font-size="13" font-weight="700" letter-spacing="1">
        ສະບາຍດີ! 🙏 SABAYDEE • FULL-STACK &amp; BANKING ARCHITECT
      </text>
    </g>

    <!-- Main Name Title -->
    <g filter="url(#luxeGlow)">
      <text x="500" y="142" text-anchor="middle" class="font-main" font-size="54" font-weight="900" letter-spacing="3" fill="url(#nameGlow)">
        HUEVANG XIONGPOR
      </text>
    </g>

    <!-- Animated Cycling Role Headings -->
    <text x="500" y="200" text-anchor="middle" fill="#ffffff" class="font-code" font-size="22" font-weight="600" letter-spacing="2" opacity="0">
      &lt; Full-Stack Developer &amp; Enterprise Solutions /&gt;
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.00;0.05;0.28;0.33;1.00" dur="10s" repeatCount="indefinite"/>
    </text>

    <text x="500" y="200" text-anchor="middle" fill="#ffd700" class="font-code" font-size="22" font-weight="600" letter-spacing="2" opacity="0">
      &lt; Banking Systems &amp; Core Fintech Specialist /&gt;
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.00;0.33;0.38;0.61;0.66;1.00" dur="10s" repeatCount="indefinite"/>
    </text>

    <text x="500" y="200" text-anchor="middle" fill="#2dd4bf" class="font-lao" font-size="21" font-weight="700" letter-spacing="1.5" opacity="0">
      &lt; ນັກພັດທະນາເວັບໄຊ, ແອັບມືຖື ແລະ ລະບົບທະນາຄານ /&gt;
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.00;0.66;0.71;0.95;1.00" dur="10s" repeatCount="indefinite"/>
    </text>

    <!-- Subtitle with Lao & English -->
    <text x="500" y="238" text-anchor="middle" fill="#94a3b8" class="font-lao" font-size="14.5" letter-spacing="1">
      ສ້າງສັນລະບົບຊອບແວທີ່ປອດໄພ, ວ່ອງໄວ ແລະ ຕອບໂຈດທຸລະກິດ • Vientiane, Laos 🇱🇦
    </text>

    <!-- Golden Divider Line -->
    <line x1="180" y1="262" x2="820" y2="262" stroke="url(#goldGradient)" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Bottom Metadata Badge Strip -->
    <g transform="translate(500, 302)">
      <!-- Location Badge -->
      <g transform="translate(-320, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#081017" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.4"/>
        <text x="0" y="5" text-anchor="middle" fill="#ffffff" class="font-main" font-size="12" font-weight="600">
          📍 Vientiane, Laos 🇱🇦
        </text>
      </g>

      <!-- Age Badge -->
      <g transform="translate(-120, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#081017" stroke="#ffd700" stroke-width="1" stroke-opacity="0.5"/>
        <text x="0" y="5" text-anchor="middle" fill="#ffd700" class="font-main" font-size="12" font-weight="700">
          🎂 Age: 26 Years
        </text>
      </g>

      <!-- Phone Badge -->
      <g transform="translate(90, 0)">
        <rect x="-95" y="-16" width="190" height="32" rx="16" fill="#081017" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.4"/>
        <text x="0" y="5" text-anchor="middle" fill="#ffffff" class="font-code" font-size="12" font-weight="600">
          📞 020 78849378
        </text>
      </g>

      <!-- Email Badge -->
      <g transform="translate(315, 0)">
        <rect x="-105" y="-16" width="210" height="32" rx="16" fill="#081017" stroke="#ffd700" stroke-width="1" stroke-opacity="0.5"/>
        <text x="0" y="5" text-anchor="middle" fill="#ffd700" class="font-code" font-size="12" font-weight="600">
          ✉️ huevang933@gmail.com
        </text>
      </g>
    </g>

    <!-- Outer Luxury Border in Teal & Gold -->
    <rect x="1" y="1" width="998" height="358" rx="19" fill="none" stroke="url(#tealGradient)" stroke-width="1.8" stroke-opacity="0.6"/>
  </g>
</svg>