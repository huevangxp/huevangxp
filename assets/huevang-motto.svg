<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 180" width="1000" height="180" role="img" aria-label="Excellence through clean architecture, continuous innovation &amp; precision - Huevang XIONGPOR">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&amp;family=Fira+Code:wght@600;700&amp;display=swap');
      .head { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif; }
      .code { font-family: 'Fira Code', Menlo, Consolas, monospace; }
    </style>

    <linearGradient id="mottoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020408"/>
      <stop offset="50%" stop-color="#050d17"/>
      <stop offset="100%" stop-color="#010305"/>
    </linearGradient>

    <linearGradient id="mottoBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <linearGradient id="gridFadeMotto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.25"/>
    </linearGradient>

    <pattern id="mottoGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#0d9488" stroke-width="0.7" stroke-opacity="0.05"/>
      <circle cx="0" cy="0" r="1.2" fill="#ffd700" fill-opacity="0.12"/>
    </pattern>

    <clipPath id="mottoClip">
      <rect width="1000" height="180"/>
    </clipPath>
  </defs>

  <g clip-path="url(#mottoClip)">
    <!-- Base Canvas Background -->
    <rect width="1000" height="180" fill="url(#mottoBg)"/>
    <rect width="1000" height="180" fill="url(#mottoGrid)"/>

    <!-- 3D Perspective Lines in Background -->
    <g opacity="0.6">
      <line x1="500" y1="40" x2="-80" y2="180" stroke="url(#gridFadeMotto)" stroke-width="1.1"/>
      <line x1="500" y1="40" x2="180" y2="180" stroke="url(#gridFadeMotto)" stroke-width="1.1"/>
      <line x1="500" y1="40" x2="380" y2="180" stroke="url(#gridFadeMotto)" stroke-width="1.1"/>
      <line x1="500" y1="40" x2="620" y2="180" stroke="url(#gridFadeMotto)" stroke-width="1.1"/>
      <line x1="500" y1="40" x2="820" y2="180" stroke="url(#gridFadeMotto)" stroke-width="1.1"/>
      <line x1="500" y1="40" x2="1080" y2="180" stroke="url(#gridFadeMotto)" stroke-width="1.1"/>
    </g>

    <!-- Animated Cyber Laser Scanner Line -->
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#0d9488" stroke-width="1.3" stroke-opacity="0.35">
      <animate attributeName="y1" values="36;175;36" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="36;175;36" dur="5s" repeatCount="indefinite"/>
    </line>

    <!-- ════════════════════ TOP TERMINAL BAR ════════════════════ -->
    <rect width="1000" height="36" fill="#060e18"/>
    <line x1="0" y1="36" x2="1000" y2="36" stroke="#0d9488" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Window Dots -->
    <circle cx="26" cy="18" r="5.5" fill="#ff5f56"/>
    <circle cx="44" cy="18" r="5.5" fill="#ffbd2e"/>
    <circle cx="62" cy="18" r="5.5" fill="#2dd4bf"/>

    <!-- Title Bar Label -->
    <text x="500" y="23" text-anchor="middle" fill="#ffffff" class="head" font-size="12.5" font-weight="800" letter-spacing="2">
      ⚡ CORE ARCHITECTURAL PHILOSOPHY &amp; ENGINEERING MOTTO
    </text>

    <!-- Right Live Status Indicator (Gold) -->
    <circle cx="838" cy="18" r="4" fill="#ffd700">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="850" y="22" fill="#ffd700" class="code" font-size="10.5" font-weight="700" letter-spacing="0.5">
      MISSION_ACTIVE
    </text>

    <!-- ════════════════════ MAIN CONTENT ════════════════════ -->
    <!-- Left Accent Bracket with Pulse -->
    <path d="M 36 60 L 22 60 L 22 150 L 36 150" fill="none" stroke="#0d9488" stroke-width="2"/>
    <circle cx="22" cy="105" r="3.5" fill="#2dd4bf">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <!-- Right Accent Bracket with Pulse -->
    <path d="M 964 60 L 978 60 L 978 150 L 964 150" fill="none" stroke="#ffd700" stroke-width="2"/>
    <circle cx="978" cy="105" r="3.5" fill="#ffd700">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <!-- Top Badge -->
    <g transform="translate(500, 62)">
      <rect x="-115" y="-12" width="230" height="22" fill="#071a1c" stroke="#0d9488" stroke-width="0.9"/>
      <circle cx="-95" cy="-1" r="3" fill="#2dd4bf"/>
      <text x="6" y="3" text-anchor="middle" fill="#2dd4bf" class="code" font-size="10" font-weight="700" letter-spacing="1">
        [SYS_PHILOSOPHY // STANDARD]
      </text>
    </g>

    <!-- Main Quote in Bold Prestigious Typography -->
    <text x="500" y="104" text-anchor="middle" class="head" font-size="21" font-weight="900" letter-spacing="1.2">
      <tspan fill="#ffd700">✨ "</tspan><tspan fill="#ffffff">Excellence through </tspan><tspan fill="#ffd700">clean architecture</tspan><tspan fill="#ffffff">, continuous </tspan><tspan fill="#2dd4bf">innovation</tspan><tspan fill="#ffffff"> &amp; </tspan><tspan fill="#ffd700">precision</tspan><tspan fill="#ffffff">.</tspan><tspan fill="#ffd700">" ✨</tspan>
    </text>

    <!-- Subtitle Telemetry -->
    <text x="500" y="128" text-anchor="middle" fill="#2dd4bf" class="code" font-size="12" font-weight="700" letter-spacing="1">
      ⚡ HUEVANG XIONGPOR • FULL-STACK &amp; BANKING ARCHITECT • VIENTIANE, LAOS 🇱🇦
    </text>

    <!-- 4 Mini Quality Pillars -->
    <g transform="translate(500, 154)">
      <!-- Pillar 1 -->
      <g transform="translate(-315, 0)">
        <rect x="-65" y="-9" width="130" height="18" fill="#08141d" stroke="#0d9488" stroke-width="0.8"/>
        <text x="0" y="4" text-anchor="middle" fill="#ffffff" class="code" font-size="9.5" font-weight="700">CLEAN CODE</text>
      </g>
      <!-- Pillar 2 -->
      <g transform="translate(-105, 0)">
        <rect x="-70" y="-9" width="140" height="18" fill="#181506" stroke="#ffd700" stroke-width="0.8"/>
        <text x="0" y="4" text-anchor="middle" fill="#ffffff" class="code" font-size="9.5" font-weight="700">HIGH CONCURRENCY</text>
      </g>
      <!-- Pillar 3 -->
      <g transform="translate(105, 0)">
        <rect x="-70" y="-9" width="140" height="18" fill="#08141d" stroke="#0d9488" stroke-width="0.8"/>
        <text x="0" y="4" text-anchor="middle" fill="#ffffff" class="code" font-size="9.5" font-weight="700">ZERO DOWNTIME</text>
      </g>
      <!-- Pillar 4 -->
      <g transform="translate(315, 0)">
        <rect x="-65" y="-9" width="130" height="18" fill="#181506" stroke="#ffd700" stroke-width="0.8"/>
        <text x="0" y="4" text-anchor="middle" fill="#ffffff" class="code" font-size="9.5" font-weight="700">PRECISION APIS</text>
      </g>
    </g>

    <!-- Outer Luxury Border (Sharp 90-degree corners) -->
    <rect x="1" y="1" width="998" height="178" fill="none" stroke="url(#mottoBorder)" stroke-width="1.8" stroke-opacity="0.6"/>
  </g>
</svg>
