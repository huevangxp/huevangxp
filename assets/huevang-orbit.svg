<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Huevang XIONGPOR Technology Orbit">
  <defs>
    <linearGradient id="coreG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="haloG">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#ffd700" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(300, 300)">
    <!-- Ambient Center Halo -->
    <circle r="130" fill="url(#haloG)"/>

    <!-- Concentric Dash Orbit Rings -->
    <circle r="100" fill="none" stroke="#2dd4bf" stroke-opacity="0.3" stroke-dasharray="3 7">
      <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle r="170" fill="none" stroke="#ffd700" stroke-opacity="0.3" stroke-dasharray="4 8">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="30s" repeatCount="indefinite"/>
    </circle>
    <circle r="236" fill="none" stroke="#2dd4bf" stroke-opacity="0.3" stroke-dasharray="3 7">
      <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="42s" repeatCount="indefinite"/>
    </circle>

    <!-- Center Badge: HUEVANG -->
    <circle r="44" fill="#060c12" stroke="url(#coreG)" stroke-width="3"/>
    <text x="0" y="-4" text-anchor="middle" fill="#ffd700" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="900" letter-spacing="1">HUEVANG</text>
    <text x="0" y="14" text-anchor="middle" fill="#2dd4bf" font-family="'Fira Code',monospace" font-size="11" font-weight="700">26 y/o</text>

    <!-- Ring 1 (Speed: 20s) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      <!-- Python -->
      <g transform="translate(100.0, 0.0)">
        <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="20s" repeatCount="indefinite"/>
          <rect x="-42" y="-14" width="84" height="28" fill="#081018" stroke="#ffd700" stroke-width="1.4"/>
          <circle cx="-28" cy="0" r="4" fill="#ffd700"/>
          <text x="8" y="4.5" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI',sans-serif" font-size="12.5" font-weight="700">Python</text>
        </g>
      </g>
      <!-- Node.js -->
      <g transform="translate(-50.0, 86.6)">
        <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="20s" repeatCount="indefinite"/>
          <rect x="-44" y="-14" width="88" height="28" fill="#081018" stroke="#2dd4bf" stroke-width="1.4"/>
          <circle cx="-30" cy="0" r="4" fill="#2dd4bf"/>
          <text x="8" y="4.5" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI',sans-serif" font-size="12.5" font-weight="700">Node.js</text>
        </g>
      </g>
      <!-- Vue 3 -->
      <g transform="translate(-50.0, -86.6)">
        <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="20s" repeatCount="indefinite"/>
          <rect x="-38" y="-14" width="76" height="28" fill="#081018" stroke="#2dd4bf" stroke-width="1.4"/>
          <circle cx="-24" cy="0" r="4" fill="#2dd4bf"/>
          <text x="8" y="4.5" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI',sans-serif" font-size="12.5" font-weight="700">Vue 3</text>
        </g>
      </g>
    </g>

    <!-- Ring 2 (Speed: 30s counter-clockwise) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="30s" repeatCount="indefinite"/>
      <!-- React -->
      <g transform="translate(170.0, 0.0)">
        <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
          <rect x="-36" y="-14" width="72" height="28" fill="#081018" stroke="#2dd4bf" stroke-width="1.4"/>
          <circle cx="-22" cy="0" r="4" fill="#2dd4bf"/>
          <text x="8" y="4.5" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI',sans-serif" font-size="12.5" font-weight="700">React</text>
        </g>
      </g>
      <!-- Nest.js -->
      <g transform="translate(0.0, 170.0)">
        <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
          <rect x="-42" y="-14" width="84" height="28" fill="#081018" stroke="#ffd700" stroke-width="1.4"/>
          <circle cx="-28" cy="0" r="4" fill="#ffd700"/>
          <text x="8" y="4.5" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI',sans-serif" font-size="12.5" font-weight="700">Nest.js</text>
        </g>
      </g>
      <!-- Flutter -->
      <g transform="translate(-170.0, 0.0)">
        <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
          <rect x="-40" y="-14" width="80" height="28" fill="#081018" stroke="#2dd4bf" stroke-width="1.4"/>
          <circle cx="-26" cy="0" r="4" fill="#2dd4bf"/>
          <text x="8" y="4.5" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI',sans-serif" font-size="12.5" font-weight="700">Flutter</text>
        </g>
      </g>
      <!-- Nuxt 3 -->
      <g transform="translate(0.0, -170.0)">
        <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
          <rect x="-40" y="-14" width="80" height="28" fill="#081018" stroke="#ffd700" stroke-width="1.4"/>
          <circle cx="-26" cy="0" r="4" fill="#ffd700"/>
          <text x="8" y="4.5" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI',sans-serif" font-size="12.5" font-weight="700">Nuxt 3</text>
        </g>
      </g>
    </g>

    <!-- Ring 3 (Speed: 42s clockwise) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="42s" repeatCount="indefinite"/>
      <!-- PostgreSQL -->
      <g transform="translate(236.0, 0.0)">
        <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="42s" repeatCount="indefinite"/>
          <rect x="-55" y="-14" width="110" height="28" fill="#081018" stroke="#2dd4bf" stroke-width="1.4"/>
          <circle cx="-38" cy="0" r="4" fill="#2dd4bf"/>
          <text x="10" y="4.5" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI',sans-serif" font-size="12.5" font-weight="700">PostgreSQL</text>
        </g>
      </g>
      <!-- Banking APIs -->
      <g transform="translate(-118.0, 204.4)">
        <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="42s" repeatCount="indefinite"/>
          <rect x="-60" y="-14" width="120" height="28" fill="#081018" stroke="#ffd700" stroke-width="1.4"/>
          <circle cx="-44" cy="0" r="4" fill="#ffd700"/>
          <text x="10" y="4.5" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="700">Banking APIs</text>
        </g>
      </g>
      <!-- Docker -->
      <g transform="translate(-118.0, -204.4)">
        <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="42s" repeatCount="indefinite"/>
          <rect x="-40" y="-14" width="80" height="28" fill="#081018" stroke="#2dd4bf" stroke-width="1.4"/>
          <circle cx="-26" cy="0" r="4" fill="#2dd4bf"/>
          <text x="8" y="4.5" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI',sans-serif" font-size="12.5" font-weight="700">Docker</text>
        </g>
      </g>
    </g>
  </g>
</svg>