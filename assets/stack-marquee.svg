<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120" role="img" aria-label="Scrolling list of technologies">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
      .chip-text { font-family: 'Share Tech Mono', Consolas, monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.8px; }
      @keyframes left { to { transform: translateX(-1240px); } }
      @keyframes right { from { transform: translateX(-1240px); } to { transform: translateX(0); } }
      .r1 { animation: left 24s linear infinite; }
      .r2 { animation: right 26s linear infinite; }
    </style>
    <linearGradient id="edgeFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#020408" stop-opacity="1"/>
      <stop offset="6%" stop-color="#020408" stop-opacity="0"/>
      <stop offset="94%" stop-color="#020408" stop-opacity="0"/>
      <stop offset="100%" stop-color="#020408" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Track Canvas -->
  <rect width="1000" height="120" fill="#020408"/>

  <!-- Cyber Track Center Guidance Line -->
  <line x1="0" y1="60" x2="1000" y2="60" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.12" stroke-dasharray="10 6"/>

  <!-- Row 1: Leftward Scrolling Arsenal -->
  <g class="r1">
    <!-- Sequence 1 -->
    <g transform="translate(0, 14)">
      <!-- Vue 3 -->
      <g transform="translate(0, 0)">
        <rect width="100" height="36" fill="#05101a" stroke="#00ff66" stroke-width="1.2"/>
        <rect x="0" y="0" width="4" height="36" fill="#00ff66"/>
        <text x="54" y="23" text-anchor="middle" fill="#00ff66" class="chip-text">Vue 3</text>
