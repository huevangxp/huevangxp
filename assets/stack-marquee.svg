        <rect x="0" y="0" width="4" height="36" fill="#ffd700"/>
        <text x="54" y="23" text-anchor="middle" fill="#ffd700" class="chip-text">Python</text>
      </g>
      <!-- NestJS -->
      <g transform="translate(605, 0)">
        <rect width="100" height="36" fill="#05101a" stroke="#e0234e" stroke-width="1.2"/>
        <rect x="0" y="0" width="4" height="36" fill="#e0234e"/>
        <text x="54" y="23" text-anchor="middle" fill="#e0234e" class="chip-text">NestJS</text>
